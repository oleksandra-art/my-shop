<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechShop — Інтернет-магазин</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body { background: #f4f6f9; color: #222; }

  /* HEADER */
  header {
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff; padding: 18px 40px;
    display: flex; justify-content: space-between; align-items: center;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 15px rgba(0,0,0,.15);
  }
  header h1 { font-size: 26px; letter-spacing: 1px; }
  .cart-btn {
    background: #ff6b35; border: none; color: #fff; padding: 10px 20px;
    border-radius: 30px; cursor: pointer; font-size: 16px; font-weight: 600;
    transition: .25s;
  }
  .cart-btn:hover { background: #ff8c5a; transform: scale(1.05); }

  /* PRODUCTS GRID */
  .products {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 25px; padding: 40px;
  }
  .card {
    background: #fff; border-radius: 15px; overflow: hidden;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
    transition: .3s; display: flex; flex-direction: column;
  }
  .card:hover { transform: translateY(-8px); box-shadow: 0 12px 30px rgba(0,0,0,.15); }
  .card img { width: 100%; height: 180px; object-fit: cover; background: #eaeaea; }
  .card-body { padding: 15px; flex: 1; display: flex; flex-direction: column; }
  .card-body h3 { font-size: 18px; margin-bottom: 8px; }
  .card-body .desc { font-size: 13px; color: #777; flex: 1; margin-bottom: 10px; }
  .price { font-size: 20px; font-weight: 700; color: #2a5298; margin-bottom: 10px; }
  .card-body button {
    background: #2a5298; color: #fff; border: none; padding: 10px;
    border-radius: 8px; cursor: pointer; font-weight: 600; transition: .2s;
  }
  .card-body button:hover { background: #1e3c72; }

  /* CART SIDEBAR */
  .cart-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.5);
    opacity: 0; pointer-events: none; transition: .3s; z-index: 200;
  }
  .cart-overlay.active { opacity: 1; pointer-events: all; }
  .cart-panel {
    position: fixed; top: 0; right: -420px; width: 400px; height: 100%;
    background: #fff; z-index: 201; transition: .35s; display: flex;
    flex-direction: column; box-shadow: -5px 0 25px rgba(0,0,0,.2);
  }
  .cart-panel.active { right: 0; }
  .cart-header {
    padding: 20px; background: #2a5298; color: #fff;
    display: flex; justify-content: space-between; align-items: center;
  }
  .cart-header h2 { font-size: 20px; }
  .cart-header button {
    background: transparent; border: none; color: #fff; font-size: 24px; cursor: pointer;
  }
  .cart-items { flex: 1; overflow-y: auto; padding: 15px; }
  .cart-item {
    display: flex; gap: 10px; padding: 10px; border-bottom: 1px solid #eee; align-items: center;
  }
  .cart-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
  .cart-item-info { flex: 1; }
  .cart-item-info h4 { font-size: 14px; }
  .cart-item-info p { font-size: 13px; color: #2a5298; font-weight: 600; }
  .qty-controls { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .qty-controls button {
    width: 22px; height: 22px; border: none; background: #eee; border-radius: 5px;
    cursor: pointer; font-weight: bold;
  }
  .qty-controls span { font-size: 13px; }
  .remove-item { background: #ff4d4d; border: none; color: #fff; border-radius: 5px;
    padding: 4px 8px; cursor: pointer; font-size: 12px; }
  .cart-footer { padding: 20px; border-top: 2px solid #eee; background: #fafafa; }
  .cart-total { font-size: 20px; font-weight: 700; margin-bottom: 15px; color: #1e3c72; }
  .checkout-btn {
    width: 100%; padding: 14px; background: #ff6b35; color: #fff;
    border: none; border-radius: 10px; font-size: 16px; font-weight: 700;
    cursor: pointer; transition: .2s;
  }
  .checkout-btn:hover { background: #ff8c5a; }
  .empty-cart { text-align: center; color: #999; padding: 40px 0; }

  /* CHECKOUT MODAL */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6);
    display: none; align-items: center; justify-content: center; z-index: 300;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: #fff; border-radius: 15px; padding: 30px; width: 100%;
    max-width: 520px; max-height: 90vh; overflow-y: auto;
    animation: slideIn .3s ease;
  }
  @keyframes slideIn { from { transform: translateY(-30px); opacity: 0; } }
  .modal h2 { margin-bottom: 20px; color: #1e3c72; }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; font-size: 14px; margin-bottom: 5px; font-weight: 600; color: #444; }
  .form-group input, .form-group textarea {
    width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px;
    font-size: 14px; font-family: inherit;
  }
  .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #2a5298; }
  .radio-group { display: flex; gap: 20px; margin-top: 5px; }
  .radio-group label { font-weight: 400; display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .checkbox-group { display: flex; flex-direction: column; gap: 8px; margin-top: 5px; }
  .checkbox-group label { font-weight: 400; display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .modal-buttons { display: flex; gap: 10px; margin-top: 20px; }
  .modal-buttons button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
  .btn-confirm { background: #28a745; color: #fff; }
  .btn-confirm:hover { background: #218838; }
  .btn-cancel { background: #ddd; color: #333; }
  .btn-cancel:hover { background: #ccc; }

  /* TOAST */
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: #28a745; color: #fff; padding: 14px 28px; border-radius: 10px;
    font-weight: 600; opacity: 0; transition: .4s; z-index: 500; box-shadow: 0 5px 20px rgba(0,0,0,.2);
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* BADGE */
  .badge {
    background: #ff3b3b; color: #fff; border-radius: 50%;
    padding: 2px 8px; font-size: 12px; margin-left: 6px;
  }

  @media (max-width: 500px) {
    .cart-panel { width: 100%; right: -100%; }
    header { padding: 15px 20px; }
    .products { padding: 20px; gap: 15px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <h1>🛍️ TechShop</h1>
  <button class="cart-btn" onclick="toggleCart()">
    🛒 Кошик <span class="badge" id="cartCount">0</span>
  </button>
</header>

<!-- PRODUCTS -->
<div class="products" id="productsGrid"></div>

<!-- CART OVERLAY -->
<div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>

<!-- CART PANEL -->
<div class="cart-panel" id="cartPanel">
  <div class="cart-header">
    <h2>🛒 Ваш кошик</h2>
    <button onclick="toggleCart()">✕</button>
  </div>
  <div class="cart-items" id="cartItems"></div>
  <div class="cart-footer">
    <div class="cart-total">Разом: <span id="cartTotal">0</span> ₴</div>
    <button class="checkout-btn" onclick="openCheckout()">Оформити замовлення</button>
  </div>
</div>

<!-- CHECKOUT MODAL -->
<div class="modal-overlay" id="checkoutModal">
  <div class="modal">
    <h2>📦 Оформлення замовлення</h2>
    <div class="form-group">
      <label for="orderName">Ваше ім'я *</label>
      <input type="text" id="orderName" placeholder="Іван Петренко">
    </div>
    <div class="form-group">
      <label for="orderEmail">Email *</label>
      <input type="email" id="orderEmail" placeholder="example@domain.com">
    </div>
    <div class="form-group">
      <label for="orderPhone">Телефон *</label>
      <input type="tel" id="orderPhone" placeholder="+380123456789">
    </div>
    <div class="form-group">
      <label for="orderCity">Місто</label>
      <input type="text" id="orderCity" placeholder="Київ">
    </div>
    <div class="form-group">
      <label>Спосіб доставки *</label>
      <div class="radio-group">
        <label><input type="radio" name="delivery" value="Нова Пошта" checked> Нова Пошта</label>
        <label><input type="radio" name="delivery" value="Укрпошта"> Укрпошта</label>
        <label><input type="radio" name="delivery" value="Кур'єр"> Кур'єр</label>
      </div>
    </div>
    <div class="form-group">
      <label>Додаткові опції:</label>
      <div class="checkbox-group">
        <label><input type="checkbox" id="optGift"> 🎁 Подарункова упаковка (+50 ₴)</label>
        <label><input type="checkbox" id="optInsurance"> 🛡️ Страхування посилки (+30 ₴)</label>
        <label><input type="checkbox" id="optSms"> 📱 SMS-повідомлення (+10 ₴)</label>
      </div>
    </div>
    <div class="form-group">
      <label for="orderComment">Коментар до замовлення</label>
      <textarea id="orderComment" rows="3" placeholder="Ваші побажання..."></textarea>
    </div>
    <div class="modal-buttons">
      <button class="btn-cancel" onclick="closeCheckout()">Скасувати</button>
      <button class="btn-confirm" onclick="confirmOrder()">Підтвердити</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
/* ============ ДАНІ ТОВАРІВ ============ */
const products = [
  { id: 1, name: "Смартфон Galaxy X", price: 12999, desc: "6.5\", 128GB, 50MP", img: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400" },
  { id: 2, name: "Ноутбук ProBook", price: 25999, desc: "15.6\", i5, 16GB RAM", img: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=400" },
  { id: 3, name: "Навушники AirSound", price: 2499, desc: "Bluetooth 5.3, ANC", img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400" },
  { id: 4, name: "Смарт-годинник Fit", price: 3499, desc: "AMOLED, GPS, 7 днів", img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400" },
  { id: 5, name: "Фотоапарат EOS", price: 18999, desc: "24MP, 4K відео", img: "https://images.unsplash.com/photo-1502920917128-1aa500764cbd?w=400" },
  { id: 6, name: "Клавіатура Mech", price: 1899, desc: "RGB, механічна", img: "https://images.unsplash.com/photo-1587829741301-dc798b83add3?w=400" },
  { id: 7, name: "Мишка Wireless", price: 899, desc: "Бездротова, 16000 DPI", img: "https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?w=400" },
  { id: 8, name: "Планшет Tab Pro", price: 8999, desc: "10.5\", 64GB, Wi-Fi", img: "https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?w=400" },
];

/* ============ КОШИК ============ */
let cart = JSON.parse(localStorage.getItem("techshopCart")) || [];

/* ============ РЕНДЕР ТОВАРІВ ============ */
function renderProducts() {
  const grid = document.getElementById("productsGrid");
  grid.innerHTML = products.map(p => `
    <div class="card">
      <img src="${p.img}" alt="${p.name}">
      <div class="card-body">
        <h3>${p.name}</h3>
        <p class="desc">${p.desc}</p>
        <div class="price">${p.price.toLocaleString()} ₴</div>
        <button onclick="addToCart(${p.id})">Додати в кошик</button>
      </div>
    </div>
  `).join("");
}

/* ============ ДОДАТИ В КОШИК ============ */
function addToCart(id) {
  const product = products.find(p => p.id === id);
  const item = cart.find(i => i.id === id);
  if (item) {
    item.qty++;
  } else {
    cart.push({ ...product, qty: 1 });
  }
  saveCart();
  showToast(`✅ "${product.name}" додано до кошика`);
}

/* ============ ЗБЕРЕГТИ В LOCALSTORAGE ============ */
function saveCart() {
  localStorage.setItem("techshopCart", JSON.stringify(cart));
  renderCart();
  updateBadge();
}

/* ============ РЕНДЕР КОШИКА ============ */
function renderCart() {
  const container = document.getElementById("cartItems");
  if (cart.length === 0) {
    container.innerHTML = `<div class="empty-cart">🛒 Кошик порожній</div>`;
    document.getElementById("cartTotal").textContent = "0";
    return;
  }
  container.innerHTML = cart.map(item => `
    <div class="cart-item">
      <img src="${item.img}" alt="${item.name}">
      <div class="cart-item-info">
        <h4>${item.name}</h4>
        <p>${(item.price * item.qty).toLocaleString()} ₴</p>
        <div class="qty-controls">
          <button onclick="changeQty(${item.id}, -1)">−</button>
          <span>${item.qty} шт.</span>
          <button onclick="changeQty(${item.id}, 1)">+</button>
        </div>
      </div>
      <button class="remove-item" onclick="removeFromCart(${item.id})">🗑</button>
    </div>
  `).join("");
  const total = cart.reduce((sum, i) => sum + i.price * i.qty, 0);
  document.getElementById("cartTotal").textContent = total.toLocaleString();
}

/* ============ ЗМІНА КІЛЬКОСТІ ============ */
function changeQty(id, delta) {
  const item = cart.find(i => i.id === id);
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) {
    cart = cart.filter(i => i.id !== id);
  }
  saveCart();
}

/* ============ ВИДАЛИТИ З КОШИКА ============ */
function removeFromCart(id) {
  cart = cart.filter(i => i.id !== id);
  saveCart();
  showToast("🗑 Товар видалено з кошика");
}

/* ============ ОНОВИТИ ЛІЧИЛЬНИК ============ */
function updateBadge() {
  const count = cart.reduce((s, i) => s + i.qty, 0);
  document.getElementById("cartCount").textContent = count;
}

/* ============ ВІДКРИТИ/ЗАКРИТИ КОШИК ============ */
function toggleCart() {
  document.getElementById("cartPanel").classList.toggle("active");
  document.getElementById("cartOverlay").classList.toggle("active");
}

/* ============ ОФОРМЛЕННЯ ЗАМОВЛЕННЯ ============ */
function openCheckout() {
  if (cart.length === 0) {
    showToast("❌ Кошик порожній!");
    return;
  }
  toggleCart();
  document.getElementById("checkoutModal").classList.add("active");
}

function closeCheckout() {
  document.getElementById("checkoutModal").classList.remove("active");
}

/* ============ ПІДТВЕРДЖЕННЯ ЗАМОВЛЕННЯ ============ */
function confirmOrder() {
  const name = document.getElementById("orderName").value.trim();
  const email = document.getElementById("orderEmail").value.trim();
  const phone = document.getElementById("orderPhone").value.trim();
  const city = document.getElementById("orderCity").value.trim();
  const comment = document.getElementById("orderComment").value.trim();
  const delivery = document.querySelector('input[name="delivery"]:checked').value;

  // Валідація
  if (!name || !email || !phone) {
    alert("⚠️ Будь ласка, заповніть ім'я, email та телефон!");
    return;
  }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    alert("⚠️ Некоректний email!");
    return;
  }
  if (!/^\+?\d{10,13}$/.test(phone.replace(/\s/g, ""))) {
    alert("⚠️ Некоректний телефон!");
    return;
  }

  // Додаткові опції
  let extra = 0;
  if (document.getElementById("optGift").checked) extra += 50;
  if (document.getElementById("optInsurance").checked) extra += 30;
  if (document.getElementById("optSms").checked) extra += 10;

  const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const total = subtotal + extra;

  // Формуємо замовлення
  const order = {
    name, email, phone, city, comment, delivery,
    extra,
    items: cart,
    subtotal,
    total,
    date: new Date().toLocaleString("uk-UA"),
  };

  // Зберігаємо в localStorage
  const orders = JSON.parse(localStorage.getItem("techshopOrders")) || [];
  orders.push(order);
  localStorage.setItem("techshopOrders", JSON.stringify(orders));

  // Показуємо підтвердження
  alert(
    `✅ Замовлення оформлено!\n\n` +
    `👤 ${name}\n` +
    `📧 ${email}\n` +
    `📞 ${phone}\n` +
    `🏙️ ${city || "—"}\n` +
    `🚚 ${delivery}\n` +
    `📦 Товарів: ${cart.reduce((s, i) => s + i.qty, 0)} шт.\n` +
    `💵 Разом: ${total.toLocaleString()} ₴`
  );

  // Очищаємо кошик і форму
  cart = [];
  saveCart();
  closeCheckout();
  document.getElementById("checkoutModal").querySelectorAll("input[type=text], input[type=email], input[type=tel], textarea").forEach(el => el.value = "");
  document.getElementById("optGift").checked = false;
  document.getElementById("optInsurance").checked = false;
  document.getElementById("optSms").checked = false;
}

/* ============ TOAST ============ */
let toastTimer;
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2500);
}

/* ============ ІНІЦІАЛІЗАЦІЯ ============ */
renderProducts();
renderCart();
updateBadge();
</script>
</body>
</html>
